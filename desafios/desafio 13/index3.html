<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>terceira tabela</title>
    <style>
        table{
            width: 500px;
            border-collapse: collapse;
        }
       
        th, td{
            border: 1px solid black;
        }
        td.numero{
            text-align: center;
        }
        tr.destaque{
            background-color: grey;
            color: white;
        }


    </style>
</head>
<body>
    <table>
        <thead>
            <tr class="destaque">
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr class="destaque">
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>matemática</td>
                <td class="numero">0.0</td>
                <td class="numero">0.0</td>
                <td class="numero">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="numero">1.0</td>
                <td class="numero">1.0</td>
                <td class="numero">1.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td class="numero">2.0</td>
                <td class="numero">2.0</td>
                <td class="numero">2.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="numero">3.0</td>
                <td class="numero">3.0</td>
                <td class="numero">3.0</td>
            </tr>
            <tr class="destaque">
                <th colspan="4">Média de Exatas</th>
                <td class="numero">x</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td class="numero">8.0</td>
                <td class="numero">8.0</td>
                <td class="numero">8.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="numero">10</td>
                <td class="numero">10</td>
                <td class="numero">10</td>
            </tr>
            
                <tr class="destaque">
                    <th colspan="4">Média de Humanas</th>
                    <td class="numero">y</td>
                </tr>
            
        </tbody>
    </table>
</body>
</html>
